name: ML CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'ml/**'
      - '.github/workflows/ml-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ml/**'

jobs:
  # ===========================
  # Linting and Formatting
  # ===========================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ml-${{ hashFiles('ml/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ml-
      
      - name: Install dependencies
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      
      - name: Run Ruff linter
        working-directory: ml
        run: ruff check . --exclude distraction_detection_poc.ipynb
      
      - name: Check Black formatting
        working-directory: ml
        run: black --check . --exclude distraction_detection_poc.ipynb

  # ===========================
  # Notebook Tests
  # ===========================
  test-notebooks:
    name: Test Jupyter Notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ml-${{ hashFiles('ml/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ml-
      
      - name: Install dependencies
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install papermill nbconvert jupyter
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Execute notebooks with Papermill
        working-directory: ml
        run: |
          # Test each notebook
          for notebook in *.ipynb; do
            if [ -f "$notebook" ]; then
              echo "Testing $notebook..."
              papermill "$notebook" "output_$notebook" --log-output || {
                echo "❌ Notebook $notebook failed"
                exit 1
              }
              echo "✅ Notebook $notebook passed"
            fi
          done
      
      - name: Upload executed notebooks
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: executed-notebooks
          path: ml/output_*.ipynb
          retention-days: 7

  # ===========================
  # Model Validation
  # ===========================
  validate-models:
    name: Validate ML Models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ml-${{ hashFiles('ml/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ml-
      
      - name: Install dependencies
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Validate model loading
        working-directory: ml
        run: |
          python -c "
          import mediapipe as mp
          import tensorflow as tf
          
          print('✅ MediaPipe version:', mp.__version__)
          print('✅ TensorFlow version:', tf.__version__)
          
          # Test MediaPipe FaceMesh
          face_mesh = mp.solutions.face_mesh.FaceMesh(
              static_image_mode=True,
              max_num_faces=1,
              min_detection_confidence=0.5
          )
          print('✅ MediaPipe FaceMesh loaded successfully')
          
          # Test TensorFlow model creation
          model = tf.keras.applications.MobileNetV2(
              input_shape=(224, 224, 3),
              include_top=False,
              weights=None
          )
          print('✅ MobileNetV2 model created successfully')
          print('✅ All model validation checks passed!')
          "
      
      - name: Check model file sizes
        working-directory: ml
        run: |
          echo "Checking for large model files..."
          find . -name "*.h5" -o -name "*.pb" -o -name "*.tflite" | while read file; do
            size=$(du -m "$file" | cut -f1)
            if [ $size -gt 50 ]; then
              echo "⚠️ Warning: $file is ${size}MB (>50MB)"
            else
              echo "✅ $file size OK: ${size}MB"
            fi
          done

  # ===========================
  # Performance Benchmarking
  # ===========================
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ml-${{ hashFiles('ml/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ml-
      
      - name: Install dependencies
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-benchmark
      
      - name: Run inference speed tests
        working-directory: ml
        run: |
          python -c "
          import time
          import numpy as np
          import mediapipe as mp
          
          # Initialize FaceMesh
          face_mesh = mp.solutions.face_mesh.FaceMesh(
              static_image_mode=True,
              max_num_faces=1,
              min_detection_confidence=0.5
          )
          
          # Create test image
          test_image = np.random.randint(0, 255, (480, 640, 3), dtype=np.uint8)
          
          # Warmup
          for _ in range(5):
              face_mesh.process(test_image)
          
          # Benchmark
          num_runs = 100
          start_time = time.time()
          
          for _ in range(num_runs):
              results = face_mesh.process(test_image)
          
          total_time = time.time() - start_time
          avg_time_ms = (total_time / num_runs) * 1000
          fps = 1000 / avg_time_ms
          
          print(f'Average inference time: {avg_time_ms:.2f}ms')
          print(f'Estimated FPS: {fps:.2f}')
          
          # Check against requirements (< 50ms, >= 20 FPS)
          assert avg_time_ms < 50, f'❌ Inference too slow: {avg_time_ms:.2f}ms (target: <50ms)'
          assert fps >= 20, f'❌ FPS too low: {fps:.2f} (target: >=20 FPS)'
          
          print('✅ Performance benchmarks passed!')
          "

  # ===========================
  # Model Conversion Tests
  # ===========================
  test-conversion:
    name: Test Model Conversions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ml-${{ hashFiles('ml/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ml-
      
      - name: Install dependencies
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Test TFLite conversion
        working-directory: ml
        run: |
          python -c "
          import tensorflow as tf
          import numpy as np
          
          # Create a simple test model
          model = tf.keras.Sequential([
              tf.keras.layers.Input(shape=(224, 224, 3)),
              tf.keras.layers.Conv2D(32, 3, activation='relu'),
              tf.keras.layers.GlobalAveragePooling2D(),
              tf.keras.layers.Dense(4, activation='softmax')
          ])
          
          # Convert to TFLite
          converter = tf.lite.TFLiteConverter.from_keras_model(model)
          converter.optimizations = [tf.lite.Optimize.DEFAULT]
          tflite_model = converter.convert()
          
          # Save TFLite model
          with open('test_model.tflite', 'wb') as f:
              f.write(tflite_model)
          
          # Test inference
          interpreter = tf.lite.Interpreter(model_content=tflite_model)
          interpreter.allocate_tensors()
          
          input_details = interpreter.get_input_details()
          output_details = interpreter.get_output_details()
          
          # Run inference
          test_input = np.random.random((1, 224, 224, 3)).astype(np.float32)
          interpreter.set_tensor(input_details[0]['index'], test_input)
          interpreter.invoke()
          output = interpreter.get_tensor(output_details[0]['index'])
          
          print('✅ TFLite conversion and inference successful!')
          print(f'   Output shape: {output.shape}')
          "

  # ===========================
  # Status Check Summary
  # ===========================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test-notebooks, validate-models, benchmark, test-conversion]
    if: success()
    
    steps:
      - name: All checks passed
        run: echo "✅ All ML CI checks passed successfully!"
