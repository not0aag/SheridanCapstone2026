# XcodeGen spec. The generated SafeDriveAI.xcodeproj is committed, so you only
# need this if you add/remove files: `brew install xcodegen && xcodegen`.
name: SafeDriveAI
options:
  bundleIdPrefix: ca.sheridan.capstone
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  SafeDriveAI:
    type: application
    platform: iOS
    sources:
      - path: SafeDriveAI
    info:
      path: SafeDriveAI/Info.plist
      properties:
        CFBundleDisplayName: SafeDrive AI
        NSCameraUsageDescription: >-
          SafeDrive AI uses the front camera to detect drowsiness and
          distraction while you drive. All analysis happens on this phone —
          no video is stored or transmitted.
        NSLocationWhenInUseUsageDescription: >-
          Your speed is used only to pause monitoring while you are stopped or
          parked. Enable this if you set a speed threshold in Settings.
        UIBackgroundModes: [audio]
        UIRequiredDeviceCapabilities: [front-facing-camera]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        # Debug builds talk to a plain-HTTP local dev backend (see
        # Core/Networking/AppConfig.swift). NSAllowsLocalNetworking permits
        # insecure HTTP to LAN/loopback addresses without pinning a specific
        # IP, so it keeps working if the Mac's address changes. Release
        # builds only ever use HTTPS and get no exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Debug-only dev backend host, read by AppConfig.swift at runtime.
        # Change DEV_BACKEND_HOST below and re-run `xcodegen generate` if
        # your Mac's LAN IP changes — no code edit needed.
        DEV_BACKEND_HOST: "$(DEV_BACKEND_HOST)"
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4XD49CGM7T
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          DEV_BACKEND_HOST: "142.55.48.25:8000"

  SafeDriveAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SafeDriveAITests
    dependencies:
      - target: SafeDriveAI
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SafeDriveAI:
    build:
      targets:
        SafeDriveAI: all
        SafeDriveAITests: [test]
    test:
      targets:
        - SafeDriveAITests
